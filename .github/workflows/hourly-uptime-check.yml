name: Hourly Website Uptime Check

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  uptime-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run Uptime Check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WP_API_URL: ${{ secrets.WP_API_URL }}
          WP_SECRET_KEY: ${{ secrets.WP_SECRET_KEY }}
        run: python check_uptime.py