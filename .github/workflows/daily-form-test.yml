name: Daily Contact Form Test

on:
  schedule:
    - cron: '0 7 * * *'   # Every day at 07:00 UTC (adjust as needed)
  workflow_dispatch:       # Allows manual run from GitHub UI

jobs:
  test-form:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Form Test
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python test_contact_form.py

      - name: Upload screenshot on any result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: form-test-screenshot
          path: form-test-result.png
          retention-days: 14