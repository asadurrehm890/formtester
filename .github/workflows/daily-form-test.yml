name: Daily Multi-Website Form Test

on:
  schedule:
    # Runs every day at 07:00 UTC (change the time if you want)
    - cron: '0 7 * * *'
  
  # Allows you to run it manually anytime from GitHub
  workflow_dispatch:

jobs:
  test-forms:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Multi-Website Form Tests
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python test_forms.py

      - name: Upload screenshots (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: form-test-screenshots
          path: |
            *.png
            screenshots/
          retention-days: 14